# Builds the npm tarball and the PyPI sdists and wheels. Called by CI and by
# Publish, so what gets published is exactly what CI built and checked.
name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check versions
        run: scripts/check-versions.sh "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      - name: Pack npm
        run: |
          mkdir -p dist/npm
          cd npm
          npm pack --pack-destination ../dist/npm
          # The package must stay harmless: no lifecycle scripts, ever.
          node -e 'const s = require("./package.json").scripts || {}; if (Object.keys(s).length) { console.error("package.json must not have scripts:", s); process.exit(1) }'

      - name: Build PyPI
        run: |
          python -m pip install --upgrade build twine
          for project in pypi/*/; do
            python -m build --outdir dist/pypi "$project"
          done
          python -m twine check --strict dist/pypi/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error
